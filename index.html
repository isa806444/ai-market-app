<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Terminal</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #0b1b33, #020617);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { margin: 0 0 16px 0; font-size: 30px; text-align:center; }
    .live { color:#22c55e; font-size:14px; margin-left:8px; }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }

    .controls{
      max-width:700px;
      margin:0 auto 16px auto;
      text-align:center;
    }

    .search-box { display:flex; gap:10px; margin-bottom:10px; }
    input { flex:1; padding:10px; border-radius:10px; border:none; font-size:14px; }
    button { padding:10px 14px; border-radius:10px; border:none; font-size:14px; cursor:pointer; color:white; background:#0f172a; }

    .topbar button,
    .search-box button {
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      box-shadow: 0 0 10px rgba(59,130,246,.4);
    }

    .strategy { display:flex; gap:8px; margin-bottom:8px; }
    .strategy button {
      flex:1;
      background:#0f172a;
      color:#cbd5f5;
      border:1px solid rgba(255,255,255,0.1);
      transition:.2s;
    }

    .strategy .active { color:white; border:none; }

    .scalp.active { background:linear-gradient(90deg,#22c55e,#4ade80); box-shadow:0 0 12px rgba(34,197,94,.6); }
    .day.active   { background:linear-gradient(90deg,#3b82f6,#60a5fa); box-shadow:0 0 12px rgba(59,130,246,.6); }
    .swing.active { background:linear-gradient(90deg,#a855f7,#d946ef); box-shadow:0 0 12px rgba(168,85,247,.6); }
    .momentum.active { background:linear-gradient(90deg,#f59e0b,#facc15); box-shadow:0 0 12px rgba(245,158,11,.6); }
    .mean.active  { background:linear-gradient(90deg,#ef4444,#f87171); box-shadow:0 0 12px rgba(239,68,68,.6); }

    .card { background:rgba(15,23,42,.7); border-radius:20px; padding:16px; margin-top:12px; box-shadow:0 0 0 1px rgba(255,255,255,.05); }
    .ticker { font-size:22px; font-weight:bold; }
    .price { float:right; color:#93c5fd; }

    .mode-banner{
      margin-top:8px;
      font-size:13px;
      opacity:.85;
      padding:6px 10px;
      border-radius:8px;
      display:inline-block;
    }

    .summary { margin-top:12px; color:#cbd5f5; line-height:1.4; }
    .pill { padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.15); cursor:pointer; font-size:13px; }
    .up{color:#22c55e;} .down{color:#ef4444;}
    .status { margin-top:20px; opacity:.7; text-align:center; }

    .panel{
      position:fixed;
      top:0;
      width:260px;
      height:100%;
      background:#020617;
      box-shadow:0 0 20px rgba(0,0,0,.6);
      padding:16px;
      transition:.3s;
      z-index:10;
    }

    .watch-panel{ right:-280px; }
    .watch-panel.open{ right:0; }

    .movers-panel{ left:-280px; }
    .movers-panel.open{ left:0; }

    .panel h3{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:0;
      gap:6px;
    }

    .close{ cursor:pointer; opacity:.6; }
    .close:hover{ opacity:1; }

    .watch-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,.1);
      cursor:pointer;
      font-size:13px;
    }

    .watch-item.uprow{ background:rgba(34,197,94,.08); }
    .watch-item.downrow{ background:rgba(239,68,68,.08); }

    .watch-meta{
      text-align:right;
      font-size:12px;
      opacity:.9;
      white-space:nowrap;
    }

    .badge{
      display:inline-block;
      padding:2px 6px;
      border-radius:6px;
      font-size:10px;
      margin-left:4px;
    }

    .bull{ background:#14532d; color:#22c55e; }
    .bear{ background:#7f1d1d; color:#ef4444; }
    .neutral{ background:#1e293b; color:#cbd5f5; }

    .remove{color:#ef4444;font-size:12px;cursor:pointer;margin-left:6px;}
  </style>
</head>
<body>

<div class="topbar">
  <button onclick="toggleMovers()">📊 Movers</button>
  <h1>AI Trading Terminal <span class="live">● Live</span></h1>
  <button onclick="toggleWatch()">📌 Watchlist</button>
</div>

<div class="controls">
  <div class="search-box">
    <input id="tickerInput" placeholder="TSLA, NVDA, BITF…" />
    <button id="analyzeBtn">Analyze</button>
  </div>

  <div class="strategy">
    <button id="scalpBtn" class="scalp">Scalp</button>
    <button id="dayBtn" class="day active">Day</button>
    <button id="swingBtn" class="swing">Swing</button>
    <button id="momBtn" class="momentum">Momentum</button>
    <button id="meanBtn" class="mean">Mean</button>
  </div>
</div>

<div id="result"></div>
<div class="status" id="status"></div>

<div id="watchPanel" class="panel watch-panel">
  <h3>Your Watchlist <span class="close" onclick="toggleWatch()">✖</span></h3>
  <div id="watchItems"></div>
</div>

<div id="moversPanel" class="panel movers-panel">
  <h3>Top Movers <span class="close" onclick="toggleMovers()">✖</span></h3>
  <div id="movers"></div>
</div>

<script>
const API = "https://ai-market-backend.onrender.com";

let strategy = "day";
let lastTicker = null;
let watchTimer = null;
let moversTimer = null;

const buttons = {
  scalp: document.getElementById("scalpBtn"),
  day: document.getElementById("dayBtn"),
  swing: document.getElementById("swingBtn"),
  momentum: document.getElementById("momBtn"),
  mean: document.getElementById("meanBtn")
};

const modeCopy = {
  scalp: "High-speed micro moves. Tight stops. Rapid exits.",
  day: "Intraday structure. Trend + momentum balance.",
  swing: "Multi-day positioning. Wider stops. Larger targets.",
  momentum: "Breakouts and continuation. Ride strength.",
  mean: "Fade extremes. Reversion to equilibrium."
};

/* 🔵 INSERTED — backend-aware banner support */
function getModeBanner(d){
  if(d.mode_banner){
    return d.mode_banner;
  }
  return `${strategy.toUpperCase()} — ${modeCopy[strategy]}`;
}

/* 🔵 INSERTED — safe risk rendering */
function renderRisks(risks){
  if(!risks || !risks.length) return "";
  return risks.map(x => `• ${x}`).join("<br/>") + "<br/><br/>";
}

function setStrategy(s){
  strategy = s;
  Object.keys(buttons).forEach(k=>{
    buttons[k].classList.toggle("active", k===s);
  });
  if(lastTicker) analyze(lastTicker);
}

buttons.scalp.onclick = ()=> setStrategy("scalp");
buttons.day.onclick = ()=> setStrategy("day");
buttons.swing.onclick = ()=> setStrategy("swing");
buttons.momentum.onclick = ()=> setStrategy("momentum");
buttons.mean.onclick = ()=> setStrategy("mean");

/* ---- everything below remains unchanged ---- */

async function analyze(sym){
  const ticker = (sym || document.getElementById("tickerInput").value.trim()).toUpperCase();
  if(!ticker) return;

  lastTicker = ticker;
  document.getElementById("status").textContent = "Analyzing…";
  document.getElementById("result").innerHTML = "";

  const r = await fetch(`${API}/analyze?ticker=${ticker}&strategy=${strategy}`);
  const d = await r.json();

  const levels = d.levels || {};
  const plan = d.plan || {};
  const targets = Array.isArray(plan.targets) ? plan.targets : [];
  const risks = Array.isArray(d.risk_notes) ? d.risk_notes : [];

  document.getElementById("result").innerHTML = `
    <div class="card">
      <div class="ticker">
        ${d.ticker}
        <span class="price">$${d.price ?? ""}</span>
      </div>

      <div class="mode-banner">${getModeBanner(d)}</div>

      <button onclick="addWatch('${d.ticker}')">⭐ Add to Watchlist</button>

      <div class="summary">
        <strong>Bias:</strong> ${d.bias || "Neutral"}<br/>
        <strong>Trend:</strong> ${d.trend || "Unknown"}<br/><br/>

        <strong>Key Levels</strong><br/>
        Support: ${levels.support || "N/A"}<br/>
        Resistance: ${levels.resistance || "N/A"}<br/><br/>

        <strong>Trade Plan</strong><br/>
        Entry: ${plan.entry || "—"}<br/>
        Stop: ${plan.stop || "—"}<br/>
        Targets: ${targets.join(", ")}<br/><br/>

        ${renderRisks(risks)}
        ${d.summary || ""}
      </div>
    </div>
  `;
  document.getElementById("status").textContent = "";
}

/* boot */
renderWatchlist();
</script>
</body>
</html>
