<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Terminal</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #0b1b33, #020617);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { margin: 0 0 16px 0; font-size: 30px; text-align:center; }
    .live { color:#22c55e; font-size:14px; margin-left:8px; }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }

    .controls{
      max-width:700px;
      margin:0 auto 16px auto;
      text-align:center;
    }

    .search-box { display:flex; gap:10px; margin-bottom:10px; }
    input { flex:1; padding:10px; border-radius:10px; border:none; font-size:14px; }
    button { padding:10px 14px; border-radius:10px; border:none; font-size:14px; cursor:pointer; color:white; background:#0f172a; }

    .topbar button,
    .search-box button {
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      box-shadow: 0 0 10px rgba(59,130,246,.4);
    }

    .strategy { display:flex; gap:8px; margin-bottom:8px; }
    .strategy button {
      flex:1;
      background:#0f172a;
      color:#cbd5f5;
      border:1px solid rgba(255,255,255,0.1);
      transition:.2s;
    }

    .strategy .active { color:white; border:none; }

    .scalp.active { background:linear-gradient(90deg,#22c55e,#4ade80); }
    .day.active   { background:linear-gradient(90deg,#3b82f6,#60a5fa); }
    .swing.active { background:linear-gradient(90deg,#a855f7,#d946ef); }
    .momentum.active { background:linear-gradient(90deg,#f59e0b,#facc15); }
    .mean.active  { background:linear-gradient(90deg,#ef4444,#f87171); }

    .card { background:rgba(15,23,42,.7); border-radius:20px; padding:16px; margin-top:12px; }
    .ticker { font-size:22px; font-weight:bold; }
    .price { float:right; color:#93c5fd; }

    .mode-banner{
      margin-top:8px;
      font-size:13px;
      opacity:.85;
      padding:6px 10px;
      border-radius:8px;
      display:inline-block;
      background:rgba(255,255,255,.08);
    }

    .summary { margin-top:12px; color:#cbd5f5; line-height:1.4; }
    .up{color:#22c55e;} .down{color:#ef4444;}
    .status { margin-top:20px; opacity:.7; text-align:center; }

    .panel{
      position:fixed;
      top:0;
      width:260px;
      height:100%;
      background:#020617;
      box-shadow:0 0 20px rgba(0,0,0,.6);
      padding:16px;
      transition:.3s;
      z-index:10;
    }

    .watch-panel{ right:-280px; }
    .watch-panel.open{ right:0; }

    .movers-panel{ left:-280px; }
    .movers-panel.open{ left:0; }

    .watch-item{
      display:flex;
      justify-content:space-between;
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,.1);
      font-size:13px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="topbar">
  <button onclick="toggleMovers()">📊 Movers</button>
  <h1>AI Trading Terminal <span class="live">● Live</span></h1>
  <button onclick="toggleWatch()">📌 Watchlist</button>
</div>

<div class="controls">
  <div class="search-box">
    <input id="tickerInput" placeholder="TSLA, NVDA, BITF…" />
    <button onclick="analyze()">Analyze</button>
  </div>

  <div class="strategy">
    <button class="scalp" onclick="setStrategy('scalp')">Scalp</button>
    <button class="day active" onclick="setStrategy('day')">Day</button>
    <button class="swing" onclick="setStrategy('swing')">Swing</button>
    <button class="momentum" onclick="setStrategy('momentum')">Momentum</button>
    <button class="mean" onclick="setStrategy('mean')">Mean</button>
  </div>
</div>

<div id="result"></div>
<div id="status" class="status"></div>

<script>
const API="https://ai-market-backend.onrender.com";
let strategy="day";
let lastTicker=null;

const modeCopy={
  scalp:"High-speed micro moves. Tight stops. Rapid exits.",
  day:"Intraday structure. Trend + momentum balance.",
  swing:"Multi-day positioning. Wider stops. Larger targets.",
  momentum:"Breakouts & continuation. Ride strength.",
  mean:"Fade extremes. Mean reversion framework."
};

async function safeFetch(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    return await r.json();
  }catch{
    return null;
  }
}

function setStrategy(s){
  strategy=s;
  document.querySelectorAll(".strategy button").forEach(b=>{
    b.classList.toggle("active", b.textContent.toLowerCase()===s);
  });
  if(lastTicker) analyze(lastTicker);
}

async function analyze(sym){
  const ticker=(sym||document.getElementById("tickerInput").value).trim().toUpperCase();
  if(!ticker) return;
  lastTicker=ticker;

  document.getElementById("status").textContent="Analyzing…";

  const d = await safeFetch(`${API}/analyze?ticker=${ticker}&strategy=${strategy}`);

  document.getElementById("result").innerHTML=`
    <div class="card">
      <div class="ticker">${ticker}
        <span class="price">${d?.price ? "$"+d.price : "—"}</span>
      </div>

      <div class="mode-banner">${strategy.toUpperCase()} — ${modeCopy[strategy]}</div>

      <div class="summary">
        <strong>Bias:</strong> ${d?.bias||"Neutral"}<br>
        <strong>Trend:</strong> ${d?.trend||"Unknown"}<br><br>

        <strong>Trade Plan</strong><br>
        Entry: ${d?.plan?.entry||"Unavailable"}<br>
        Stop: ${d?.plan?.stop||"Unavailable"}<br>
        Targets: ${(d?.plan?.targets||[]).join(", ")||"—"}<br><br>

        ${(d?.risk_notes||["Live data temporarily limited."]).map(x=>`• ${x}`).join("<br>")}
      </div>
    </div>
  `;

  document.getElementById("status").textContent="";
}
</script>

</body>
</html>
